name: Standard Industries
description: >-
  Standard Industries is a privately-held global industrial company headquartered
  in New York City and tracing its origins to 1886. The company operates a portfolio
  of building solutions, performance materials, logistics, real estate, and
  investment businesses, with more than 20,000 employees and approximately $11
  billion in annual revenues. Standard Building Solutions includes GAF (North
  America's largest roofing manufacturer), GAF Energy (Timberline Solar nailable
  solar shingles), BMI Group (Europe's largest pitched and flat roofing
  manufacturer, with brands including Braas, Monier, Icopal, Wolfin, and Redland),
  Siplast (specialty roofing and waterproofing for iconic structures), SGI (mining
  and mineral processing), Schiedel (flue, stove, and ventilation systems), and
  Standard Logistics. Performance Materials is anchored by W. R. Grace & Co.,
  which produces catalysts, engineered materials, process technologies, and fine
  chemicals. Standard Investments deploys capital across public equities and
  early-to-growth venture investments. Winter Properties is a vertically integrated
  real estate firm with more than 100 years of history in New York City. Standard
  Industries does not publish a public developer API or developer portal at the
  corporate level; technology integration with customers and partners is handled
  inside the individual operating companies (most notably GAF and Grace).
